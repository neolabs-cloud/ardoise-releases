<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="440" viewBox="0 0 1280 440" role="img" aria-label="Ardoise: bare-metal virtualization without the licensing shock">
<title>Ardoise</title>
<style>
@keyframes chalk { to { stroke-dashoffset: 0 } }
@keyframes up { from { opacity: 0; transform: translateY(10px) } to { opacity: 1; transform: none } }
@keyframes fade { from { opacity: 0 } to { opacity: 1 } }
@keyframes pulse { 0%, 100% { opacity: 1 } 50% { opacity: .35 } }
.mark path, .mark rect { stroke-dasharray: 260; stroke-dashoffset: 260; animation: chalk 1.4s cubic-bezier(.45,0,.2,1) .1s forwards }
.word { opacity: 0; animation: up .7s ease-out .7s forwards }
.tag { opacity: 0; animation: up .7s ease-out 1s forwards }
.chips { opacity: 0; animation: up .7s ease-out 1.3s forwards }
.panel { opacity: 0; animation: fade .6s ease-out .9s forwards }
.tile { opacity: 0; animation: up .55s ease-out forwards }
.led { animation: pulse 2.8s ease-in-out infinite }
.spark { stroke-dasharray: 420; stroke-dashoffset: 420; animation: chalk 2.2s ease-out 1.6s forwards }
@media (prefers-reduced-motion: reduce) {
  .mark path, .mark rect, .spark { animation: none; stroke-dashoffset: 0 }
  .word, .tag, .chips, .panel, .tile { animation: none; opacity: 1 }
  .led { animation: none }
}
</style>
<defs>
<radialGradient id="g" cx="78%" cy="40%" r="60%"><stop offset="0" stop-color="#5FB3C9" stop-opacity=".22"/><stop offset="1" stop-color="#5FB3C9" stop-opacity="0"/></radialGradient>
<linearGradient id="fadeR" x1="0" x2="1"><stop offset="0" stop-color="#0F1519" stop-opacity="0"/><stop offset="1" stop-color="#0F1519" stop-opacity=".6"/></linearGradient>

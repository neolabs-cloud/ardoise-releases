<text x="154" y="174" font-family="'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="14" letter-spacing="2.4" fill="#5FB3C9">BARE-METAL HYPERVISOR · BY NEO LABS</text></g>
<g class="tag"><text x="64" y="238" font-family="'IBM Plex Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="30" font-weight="600" fill="#E6ECEE">Virtualization without the</text>
<text x="64" y="276" font-family="'IBM Plex Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="30" font-weight="600" fill="#5FB3C9">licensing shock.</text>
<text x="64" y="314" font-family="'IBM Plex Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="17" fill="#B7C3C8">Install it on your own server. Manage everything from a browser.</text></g>
